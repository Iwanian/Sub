name: bot-ping
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "بدون چک زمان، همین الان به ربات پیام بده"
        type: boolean
        default: false
concurrency:
  group: telegram-session
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python bot_ping.py
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          WORKER_URL: ${{ secrets.WORKER_URL }}
          WORKER_KEY: ${{ secrets.WORKER_KEY }}
          FORCE: ${{ inputs.force }}
          BOT_USERNAME: ${{ secrets.BOT_USERNAME }}
          BOT_TEXT: ${{ secrets.BOT_TEXT }}
          BOT_INTERVAL: ${{ secrets.BOT_INTERVAL }}
          NEW_NAME: ${{ secrets.NEW_NAME }}
          OUTPUT_FILE: ${{ secrets.OUTPUT_FILE }}
      - run: |
          git config user.name "iwana-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "auto update"
            for i in 1 2 3; do git pull --rebase -q && git push && break || sleep 5; done
          fi
